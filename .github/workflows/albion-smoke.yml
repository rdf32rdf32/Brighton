name: Albion quality checks
on:
  push:
    branches: [main, audit-improvements-20261009]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *" # daily freshness check; failures are visible in GitHub Actions
permissions:
  contents: read
jobs:
  freshness:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/data-freshness.cjs
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

  webkit-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --browser webkit --grep 'goalkeeper line|Sunderland'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-mobile-artifacts
          path: test-results/
          if-no-files-found: ignore
